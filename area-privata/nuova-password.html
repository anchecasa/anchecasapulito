<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>AncheCasa · Nuova password</title>
  <link rel="icon" href="assets/logo/favicon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/kit.css">
</head>
<body>
  <div class="stage">
    <span class="dots dots-tl"></span>
    <span class="dots dots-tr"></span>
    <span class="dots dots-bl"></span>
    <span class="dots dots-br"></span>

    <section class="login-wrap" aria-label="Scegli una nuova password">
      <div class="login-left">
        <!-- Uno solo dei tre blocchi è visibile: attesa, form, oppure esito (link non valido / fatto). -->
        <div class="login-form" id="np-attesa">
          <h1>Nuova password</h1>
          <p class="sub">Verifica del link in corso…</p>
        </div>

        <form class="login-form" id="np-form" novalidate hidden>
          <h1>Nuova password</h1>
          <p class="sub">Scegli la password per entrare nell'Area riservata</p>
          <input type="password" name="password" placeholder="Nuova password (almeno 8 caratteri)" autocomplete="new-password" minlength="8" required>
          <input type="password" name="conferma" placeholder="Ripeti la nuova password" autocomplete="new-password" minlength="8" required>
          <div class="row">
            <button class="btn-in" type="submit">Salva password</button>
            <a class="forgot" href="index.html">Torna al login</a>
          </div>
          <p class="login-error" id="np-errore" role="alert" hidden></p>
        </form>

        <div class="login-form" id="np-esito" hidden>
          <h1 id="np-esito-titolo"></h1>
          <p class="sub" id="np-esito-testo"></p>
          <a class="forgot" href="index.html" id="np-esito-link">Torna al login</a>
        </div>
      </div>
      <div class="login-right">
        <div class="login-hero">
          <img src="assets/hero-isometric.svg" alt="">
        </div>
        <div class="product-name">
          <img class="product-logo" src="assets/logo/anchecasa-orizzontale-trasparente.png?v=3" alt="AncheCasa · Costruiamo fiducia">
          <small>Privati, aziende e agenti in una piazza sola</small>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/mostra-password.js"></script>
  <script src="js/nuova-password.js"></script>
</body>
</html>
