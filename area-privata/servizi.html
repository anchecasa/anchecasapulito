<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Le tue proposte · AncheCasa</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    :root { --navy: #16304d; --ink: #24384c; --muted: #66758a; --orange: #E56B10; --btn: #c45d0c; --soft: #fff1e4; --line: #e4ebf3; --paper: #f3f6fb; --ok: #1f6e40; --okbg: #e8f6ee; }
    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; touch-action: manipulation; }
    input, select, textarea { font-size: 16px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Manrope, "Segoe UI", Arial, sans-serif; font-size: 15px; line-height: 1.55; }
    .foglio { max-width: 860px; margin: 24px auto 40px; background: #fff; border-radius: 10px; box-shadow: 0 14px 40px rgba(22, 48, 77, .10); overflow: hidden; }
    .testa { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 28px 40px 20px; border-bottom: 2px solid var(--orange); }
    .testa img { width: 180px; display: block; }
    .testa small { color: var(--muted); text-align: right; }
    .corpo { padding: 26px 40px 34px; }
    .eti { display: inline-block; background: var(--soft); color: var(--btn); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 12px; padding: 5px 12px; }
    h1 { margin: 12px 0 6px; font-size: 28px; line-height: 1.15; color: var(--navy); }
    .sotto { margin: 0 0 18px; color: var(--muted); }
    .riassunto { display: flex; flex-wrap: wrap; gap: 8px 18px; background: var(--paper); border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-bottom: 18px; }
    .riassunto b { color: var(--navy); }
    .prop { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 12px 0; display: grid; grid-template-columns: 110px 1fr auto; gap: 16px; align-items: center; }
    .prop.scelta { border-color: var(--ok); box-shadow: 0 0 0 2px var(--okbg); }
    .prop .logo { width: 110px; height: 60px; border-radius: 10px; background: var(--paper); display: grid; place-items: center; overflow: hidden; font-weight: 800; color: var(--navy); font-size: 13px; text-align: center; padding: 4px; }
    .prop .logo img { max-width: 100%; max-height: 100%; }
    .prop h2 { margin: 0; font-size: 17px; color: var(--navy); }
    .prop .off { color: var(--btn); font-weight: 700; font-size: 14px; }
    .prop ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--ink); }
    .prop .nota { font-size: 13px; color: var(--muted); margin-top: 6px; font-style: italic; }
    .prezzo { text-align: right; }
    .prezzo b { display: block; font-size: 24px; color: var(--navy); }
    .prezzo small { color: var(--muted); font-size: 11px; display: block; max-width: 150px; margin-left: auto; }
    .btn { margin-top: 8px; font: inherit; font-weight: 800; color: #fff; background: var(--btn); border: 0; border-radius: 22px; padding: 10px 18px; cursor: pointer; }
    .btn:disabled { opacity: .5; cursor: default; }
    .ok { background: var(--okbg); color: var(--ok); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
    .vuoto { background: var(--paper); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); }
    .regola { font-size: 12.5px; color: var(--muted); margin-top: 20px; }
    .piede { background: var(--navy); color: #d5deea; font-size: 12px; padding: 16px 40px; }
    .conferma { display: none; margin-top: 8px; font-size: 13px; }
    .conferma.on { display: block; }
    @media (max-width: 640px) {
      .testa, .corpo, .piede { padding-left: 18px; padding-right: 18px; }
      .prop { grid-template-columns: 1fr; }
      .prezzo { text-align: left; } .prezzo small { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- Pagina del cliente (12.10.2026, app-20): le proposte di Telefonia e internet e di Finanza e assicurazioni
       dei fornitori AncheCasa, dal link nella mail. Stesso modello di offerte.html (luce e gas), che non si tocca.
       Il cliente sceglie una proposta: solo quel fornitore riceve nome, mail e telefono. -->
  <article class="foglio">
    <header class="testa">
      <img src="assets/logo/anchecasa-orizzontale-trasparente.png?v=3" alt="AncheCasa">
      <small id="cat-testa">Le tue proposte</small>
    </header>
    <div class="corpo" id="corpo"><p class="sotto">Caricamento…</p></div>
    <footer class="piede">Palumbo Investment S.r.l. · Via Giusti 22, 81057 Teano (CE) · P.IVA 04724830619 · info@anchecasa.it</footer>
  </article>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
  (function () {
    var URL = "https://edsvmnxojsmknjuhobqa.supabase.co";
    var KEY = "sb_publishable_QbYv61SkMkjA9_GGb1hhOA_6v6GEw87";
    var corpo = document.getElementById("corpo");
    var token = new URLSearchParams(location.search).get("t") || "";
    var CAT = {
      telefonia: { nome: "Telefono e internet", prezzo: "Canone", durata: "Vincolo", attiv: "Attivazione", dett: "Cosa comprende",
        tipi: { casa: "Casa (fibra o ADSL)", mobile: "Cellulare", casa_mobile: "Casa e cellulare", ufficio: "Ufficio (più linee)" },
        regola: "Prezzi come indicati dal fornitore. Scegliere una proposta non è un contratto: il contratto te lo manda il fornitore." },
      finanza: { nome: "Finanza e assicurazioni", prezzo: "Rata o premio", durata: "Durata", attiv: "Spese di istruttoria", dett: "Tasso o massimale",
        tipi: { mutuo: "Mutuo casa", prestito: "Prestito per ristrutturare", assicurazione_casa: "Assicurazione casa", polizza_cantiere: "Polizza cantiere (CAR)", decennale: "Polizza decennale postuma", fideiussione: "Fideiussione per gare", rc_professionale: "RC professionale", altro: "Altro" },
        regola: "Valori indicativi, soggetti a delibera e ai fogli informativi del fornitore. AncheCasa segnala la tua richiesta ai fornitori e non svolge attività di intermediazione o consulenza. Scegliere una proposta non è un contratto: il contratto te lo propone il fornitore." }
    };
    var SU = { mese: "al mese", anno: "all'anno", una_tantum: "una tantum", da_calcolare: "" };
    var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
    var eur = function (n, d) { return (Number(n) || 0).toLocaleString("it-IT", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) + " €"; };
    var prezzo = function (p, su) { return p == null ? "Su misura" : eur(p, 2); };
    if (!token || !window.supabase) { corpo.innerHTML = '<div class="vuoto">Link non valido. Apri il link che trovi nella mail di AncheCasa.</div>'; return; }
    var db = window.supabase.createClient(URL, KEY, { db: { schema: "marketplace" } });

    function carica() {
      db.rpc("servizi_le_mie_proposte", { p_token: token }).then(function (res) {
        if (res.error || !res.data) { corpo.innerHTML = '<div class="vuoto">Non troviamo questa richiesta. Controlla il link nella mail.</div>'; return; }
        disegna(res.data);
      }, function () { corpo.innerHTML = '<div class="vuoto">Il server non risponde. Riprova tra poco.</div>'; });
    }

    function disegna(d) {
      var r = d.richiesta, ps = d.proposte || [];
      var K = CAT[r.categoria] || CAT.telefonia;
      document.getElementById("cat-testa").innerHTML = "Le tue proposte<br>" + esc(K.nome.toLowerCase());
      var scelta = r.proposta_scelta;
      var cosa = [];
      if (r.importo) cosa.push(eur(r.importo));
      if (r.durata_mesi) cosa.push(r.durata_mesi + " mesi");
      if (r.quanti) cosa.push(r.quanti + (r.quanti === 1 ? " linea" : " linee"));
      var h = '<span class="eti">' + esc(K.nome) + '</span><h1>Ciao ' + esc(r.nome) + ', ecco le proposte per te</h1>' +
        '<p class="sotto">Le hanno preparate i fornitori iscritti ad AncheCasa sulla tua richiesta. Confrontale e scegli quella che preferisci: solo quel fornitore riceverà i tuoi contatti e ti manderà il contratto.</p>' +
        '<div class="riassunto"><span><b>Richiesta:</b> ' + esc(K.tipi[r.tipo] || r.tipo) + '</span>' + (cosa.length ? '<span><b>Dettagli:</b> ' + esc(cosa.join(" · ")) + '</span>' : '') +
        (r.spesa_mese ? '<span><b>Oggi spendi:</b> ' + eur(r.spesa_mese) + ' al mese</span>' : '') + '<span><b>Proposte:</b> ' + ps.length + '</span></div>';
      if (scelta) h += '<div class="ok"><b>Hai scelto la tua proposta.</b> Il fornitore ti contatterà a breve. Se hai domande scrivi a info@anchecasa.it.</div>';
      // 12.10.2026, app-22: dopo 15 giorni la richiesta scade.
      if (r.stato === "scaduta") h += '<div class="vuoto">Questa richiesta è scaduta dopo 15 giorni: non si può più scegliere. Puoi farne una nuova quando vuoi.</div>';
      if (!ps.length) h += '<div class="vuoto">Le proposte stanno arrivando. Ti scriviamo per mail appena ce n\'è una: puoi chiudere questa pagina.</div>';
      ps.forEach(function (p) {
        var o = p.offerta || {}, righe = [];
        if (o.dettagli) righe.push(K.dett + ": " + o.dettagli);
        if (o.durata_mesi) righe.push(K.durata + " " + o.durata_mesi + " mesi");
        if (o.attivazione != null) righe.push(K.attiv + " " + (Number(o.attivazione) ? eur(o.attivazione, 2) : "gratis"));
        if (o.note) righe.push(o.note);
        var mia = scelta === p.id;
        h += '<div class="prop' + (mia ? " scelta" : "") + '">' +
          '<div class="logo">' + (p.logo ? '<img src="' + esc(p.logo) + '" alt="' + esc(p.azienda) + '">' : esc(p.azienda)) + '</div>' +
          '<div><h2>' + esc(p.azienda) + '</h2><div class="off">' + esc(o.nome || "Proposta") + '</div><ul>' + righe.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>' +
          (p.iscrizione ? '<div class="nota" style="font-style:normal">' + esc(p.iscrizione) + '</div>' : '') +
          (p.nota ? '<div class="nota">«' + esc(p.nota) + '»</div>' : '') + '</div>' +
          '<div class="prezzo"><b>' + prezzo(p.prezzo, p.prezzo_su) + '</b><small>' + esc(K.prezzo.toLowerCase()) + (p.prezzo != null && SU[p.prezzo_su] ? " " + esc(SU[p.prezzo_su]) : "") + '</small>' +
          (scelta || r.stato === "scaduta" ? (mia ? '<div class="btn" style="background:#1f6e40">Scelta</div>' : '') :
            '<button class="btn" data-scegli="' + esc(p.id) + '">Accetto, contattatemi</button><div class="conferma" data-conf="' + esc(p.id) + '">Confermi? Solo ' + esc(p.azienda) + ' riceverà nome, mail e telefono. <button class="btn" data-ok="' + esc(p.id) + '">Sì, confermo</button></div>') +
          '</div></div>';
      });
      h += '<p class="regola">' + esc(K.regola) + '</p>';
      corpo.innerHTML = h;
      corpo.querySelectorAll("[data-scegli]").forEach(function (b) {
        b.addEventListener("click", function () {
          corpo.querySelectorAll(".conferma").forEach(function (c) { c.classList.remove("on"); });
          corpo.querySelector('[data-conf="' + b.getAttribute("data-scegli") + '"]').classList.add("on");
        });
      });
      corpo.querySelectorAll("[data-ok]").forEach(function (b) {
        b.addEventListener("click", function () {
          b.disabled = true;
          db.rpc("servizi_accetta", { p_token: token, p_proposta: b.getAttribute("data-ok") }).then(function (res) {
            if (res.error) { b.disabled = false; b.insertAdjacentHTML("afterend", "<div>Non riesco a registrare la scelta. Riprova.</div>"); return; }
            db.functions.invoke("servizi-avvisa", { body: { evento: "scelta", token: token } }).catch(function () {});
            carica();
          });
        });
      });
    }
    carica();
  })();
  </script>
</body>
</html>
